{% if actions_only %}
<div class="processos-mobile-actions card shadow-sm border-0">
  <div class="card-body p-2">
    <div class="row g-2 row-cols-2">
      <div class="col">
        <a class="btn btn-sm btn-outline-secondary w-100 text-start" href="{% url 'processos:templates' slug=slug %}">
          <i class="bi bi-arrow-left-right"></i> Acessar Modelos
        </a>
      </div>
      <div class="col">
        <a class="btn btn-sm btn-outline-primary w-100 text-start" href="{% url 'processos:lista' slug=slug %}">
          <i class="bi bi-arrow-left-right"></i> Acessar Processos
        </a>
      </div>
      <div class="col">
        <a class="btn btn-sm btn-outline-primary w-100 text-start" href="{% url 'processos:criar' slug=slug %}">
          <i class="bi bi-plus-square"></i> Criar novo Processo
        </a>
      </div>
    </div>
  </div>
</div>
{% else %}
<div class="processos-sidebar card shadow-sm border-0">
  <div class="card-body p-3">

    <h6 class="fw-bold mb-3">
      <i class="bi bi-diagram-3"></i> Menus
    </h6>

    <div class="d-grid gap-2">
      <a class="btn btn-sm btn-outline-secondary text-start d-flex align-items-center gap-2" href="{% url 'processos:templates' slug=slug %}">
        <i class="bi bi-grid-1x2"></i> Acessar Modelos
      </a>

      <a class="btn btn-sm btn-outline-primary text-start d-flex align-items-center gap-2" href="{% url 'processos:lista' slug=slug %}">
        <i class="bi bi-clipboard"></i> Acessar Processos
      </a>

      <a class="btn btn-sm btn-outline-primary text-start d-flex align-items-center gap-2" href="{% url 'processos:criar' slug=slug %}">
        <i class="bi bi-clipboard-plus"></i> Criar novo Processo
      </a>
    </div>

    <hr>

    <small class="text-muted fw-bold">Modelos</small>
    <div class="mt-2 small">
      {% for m in modelos %}
      <div class="mb-1">{{ m.chmo_nome }}</div>
      {% empty %}
      <div class="text-muted">Sem modelos</div>
      {% endfor %}
    </div>

  </div>
</div>
{% endif %}
